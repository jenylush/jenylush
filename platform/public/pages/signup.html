<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Create your wedding website — {platform}</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/app.css">
</head>
<body data-page="signup">
<a class="skip-link" href="#main">Skip to content</a>
<header id="topbar" class="topbar"></header>
<div class="auth-wrap">
  <aside class="auth-art" aria-hidden="true"><blockquote>“Our guests kept telling us how easy it was to RSVP.”</blockquote><p style="opacity:.85">— Priya & Sam</p></aside>
  <main id="main" class="auth-main"><div class="auth-card">
    <h1>Create your wedding website</h1>
    <p class="muted">Free to start, free to publish. It takes about two minutes to set up.</p>
    <form class="stack" id="form" novalidate>
      <label class="field"><span>Your name</span><input type="text" name="name" autocomplete="name" required maxlength="100"></label>
      <label class="field"><span>Email</span><input type="email" name="email" autocomplete="email" required></label>
      <label class="field"><span>Password <span class="hint">At least 10 characters</span></span><input type="password" name="password" autocomplete="new-password" required minlength="10"></label>
      <label class="check small"><input type="checkbox" name="accept_terms" required> <span>I agree to the <a href="/terms" target="_blank">terms of service</a> and <a href="/privacy" target="_blank">privacy policy</a>.</span></label>
      <label class="check small"><input type="checkbox" name="marketing_opt_in"> <span>Send me occasional tips and product news (optional).</span></label>
      <div class="sr-only" aria-hidden="true"><label>Leave this empty <input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
      <p class="form-error" role="alert" hidden></p>
      <button class="btn btn-primary btn-lg" type="submit">Create my account</button>
      <p class="small muted">Already have an account? <a href="/login">Log in</a></p>
    </form>
  </div></main>
</div>
<script type="module" src="/js/pages/auth.js"></script>
</body>
</html>
